<?xml version="1.0" encoding="UTF-8"?>
<!--
  Theo brand mark (2026-08-03 redesign).

  A thin arch/tent silhouette sitting over the lowercase "theo" wordmark 
  matching the wireframes provided by the designer for the Aug-2026
  redesign. The arch is a single stroked cubic curve so it scales cleanly
  from 24px (sidebar) up to hero sizes without pixel snapping. Rendered
  in currentColor so a parent element can flip it (e.g. white in dark
  mode) with a single `color` change.

  This is an interim mark; a future patch may swap in an official file.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 80"
  role="img"
  aria-label="Theo"
  fill="none"
>
  <g stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" fill="none">
    <!-- Arch/tent: gentle rise from left, apex slightly left of center, longer taper right. -->
    <path d="M18 44 C 26 12, 44 8, 56 28 C 66 44, 84 42, 100 34" strokeWidth="2.6" />
    <!-- Small vertical accent under the apex, like a tent pole. -->
    <path d="M56 30 L 56 44" strokeWidth="2.2" />
  </g>
  <!-- Wordmark: lowercase "theo" set in the site's UI stack (SUIT) for consistency. -->
  <text
    x="16"
    y="70"
    fontFamily="'SUIT','Geist','Helvetica Neue',Arial,sans-serif"
    fontSize="26"
    fontWeight="500"
    letterSpacing="0.5"
    fill="currentColor"
  >theo</text>
</svg>
